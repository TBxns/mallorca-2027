  { id: "rafa-nadal", name: "Rafa Nadal Museum", cat: "uitje", lat: 39.5772, lng: 3.2261, note: "Sportmuseum bij de tennisacademie" }

const map = L.map("map", { zoomControl: false, attributionControl: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap contributors",
  maxZoom: 18
}).addTo(map);
map.fitBounds([[39.24, 2.32], [39.99, 3.47]], { padding: [12, 12] });

const villa = PLEKKEN[0];
function km(p) {
  const R = 6371, dLat = (p.lat - villa.lat) * Math.PI / 180, dLng = (p.lng - villa.lng) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(villa.lat * Math.PI / 180) * Math.cos(p.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(a)));
}

let huidigFilter = "alles";
function kleur(p) {
  if (p.cat === "villa") return "#166E7B";
  if (huidigFilter === "eten" && p.ook === "eten") return "#EF8100";
  if (p.cat === "uitje") return "#4C0087";
  if (p.cat === "eten") return "#EF8100";
  return "#21ACC0";
}
function popupTekst(p) {
  const note = (huidigFilter === "eten" && p.etenNote) ? p.etenNote : p.note;
  return '<span class="pk-name">' + p.name + "</span>" +
    '<span class="pk-meta">' + note + (p.cat === "villa" ? "" : " · " + km(p) + " km hemelsbreed") + "</span>";
}

const layers = {};
PLEKKEN.forEach(p => {
  const isVilla = p.cat === "villa";
  const m = L.circleMarker([p.lat, p.lng], {
    radius: isVilla ? 9 : 7,
    color: "#FFFFFF",
    weight: 2,
    fillColor: kleur(p),
    fillOpacity: 1
  }).addTo(map);
  m.bindPopup(popupTekst(p), { closeButton: false, offset: [0, -2] });
  m.on("click", () => {
    parent.postMessage({ type: "plek", id: p.id }, "*");
  });
  layers[p.id] = m;
});

function applyFilter(filter) {
  huidigFilter = filter || "alles";
  PLEKKEN.forEach(p => {
    layers[p.id].setStyle({ fillColor: kleur(p) });
    layers[p.id].setPopupContent(popupTekst(p));
    const show = !filter || filter === "alles" || p.cat === filter || p.ook === filter || p.cat === "villa";
    const on = map.hasLayer(layers[p.id]);
    if (show && !on) layers[p.id].addTo(map);
    if (!show && on) map.removeLayer(layers[p.id]);
  });
}

function focus(id) {
  const p = PLEKKEN.find(x => x.id === id);
  if (!p) return;
  map.flyTo([p.lat, p.lng], 12, { duration: 0.6 });
  layers[p.id].openPopup();
}

window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.type === "filter") applyFilter(d.filter);
  if (d.type === "focus") focus(d.id);
  if (d.type === "reset") map.fitBounds([[39.24, 2.32], [39.99, 3.47]], { padding: [12, 12] });
});
